# The one public port of the self-hosted stack, laid out like a Supabase
# project URL: /auth/v1 → GoTrue, /rest/v1 → PostgREST. Both check JWTs
# themselves.
#
# CORS: PostgREST answers browser preflights itself; GoTrue does not (on
# Supabase's platform Kong's cors plugin does it), so a web app on another
# origin fails every sign-in with "Failed to fetch". The gateway answers for
# /auth/v1 the way Kong does: any origin, the headers supabase clients send.
map $http_origin $cors_origin {
    default $http_origin;
    ""      "*";
}

server {
    listen 80;
    client_max_body_size 10m;

    location /auth/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, x-retry-count" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            return 204;
        }
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Expose-Headers "x-supabase-api-version" always;
        add_header Vary Origin always;
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Functions answer their own preflights (_shared/cors.ts), but the
    # gateway sets the origin header so every response carries it, even an
    # error from the router.
    location /functions/v1/ {
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary Origin always;
        proxy_pass http://functions:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
