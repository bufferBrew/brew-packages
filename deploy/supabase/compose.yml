# A minimal self-hosted Supabase for Brew apps: Postgres, Auth (GoTrue),
# PostgREST, and an nginx gateway on one port. Same images and versions the
# Supabase CLI runs locally. No Studio, Storage, Realtime or Edge Functions:
# Brew apps don't need them to sign in and read/write their schema.
#
# Included by each app's compose.yml, under the `supabase` profile:
#
#   docker compose --profile supabase up
#
# Secrets come from the app's .env (generate them with
# deploy/supabase/gen-env.sh): POSTGRES_PASSWORD, JWT_SECRET, ANON_KEY,
# SERVICE_ROLE_KEY.
#
# Copied into every Brew app (deploy/supabase/) by brew/sync-deploy.sh from
# brew-packages; edit it there.

services:
  db:
    profiles: [supabase]
    image: public.ecr.aws/supabase/postgres:17.6.1.159
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?run deploy/supabase/gen-env.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?run deploy/supabase/gen-env.sh}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Run once, on first start, after the image's own init scripts.
      - ./roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-brew-roles.sql:ro
      - ./jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-brew-jwt.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    profiles: [supabase]
    image: public.ecr.aws/supabase/gotrue:v2.195.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # No SMTP in this stack, so confirm sign-ups immediately by default.
      # Set SMTP_* and MAILER_AUTOCONFIRM=false for real email confirmation.
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      # Anonymous-first apps (BrewWire, BrewFeed) need this.
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS:-true}
      # Optional OAuth providers. The redirect URI to register with Google /
      # GitHub is ${SUPABASE_PUBLIC_URL}/auth/v1/callback.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}/auth/v1/callback
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GITHUB_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GITHUB_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}/auth/v1/callback
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    profiles: [supabase]
    image: public.ecr.aws/supabase/postgrest:v16.1
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      # PostgREST won't start if a schema it exposes doesn't exist yet, so
      # the app's bundles go in first (the app's compose.yml defines migrate).
      migrate: { condition: service_completed_successfully }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public,core,${APP_SCHEMAS:?set APP_SCHEMAS in the app's compose.yml}
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}

  # The app's Edge Functions (supabase/functions/), served the way the
  # platform does at /functions/v1/<name>.
  functions:
    profiles: [supabase]
    image: public.ecr.aws/supabase/edge-runtime:v1.74.3
    restart: unless-stopped
    command: ["start", "--main-service", "/home/deno/main"]
    depends_on:
      rest: { condition: service_started }
    volumes:
      - ./functions-main:/home/deno/main:ro
      - ${FUNCTIONS_DIR:-../../supabase/functions}:/home/deno/functions:ro
    env_file:
      # The app's function secrets (API keys etc.); optional.
      - path: ${FUNCTIONS_ENV_FILE:-../../supabase/functions/.env}
        required: false
    environment:
      JWT_SECRET: ${JWT_SECRET}
      VERIFY_JWT: ${FUNCTIONS_VERIFY_JWT:-true}
      # Inside the stack, functions reach Supabase through the gateway.
      SUPABASE_URL: http://gateway:80
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?run deploy/supabase/gen-env.sh}
      SUPABASE_DB_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      # Key the core-* and app functions encrypt stored credentials with.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?run deploy/supabase/gen-env.sh}

  gateway:
    profiles: [supabase]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      auth: { condition: service_healthy }
      rest: { condition: service_started }
      functions: { condition: service_started }
    ports:
      - "${SUPABASE_PORT:-8000}:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
