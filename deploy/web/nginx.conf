server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # The router owns the URL space, so every unknown path has to reach
    # index.html rather than 404 — otherwise a refresh or a pasted deep link
    # breaks while in-app navigation to the same route works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cached: a rebuilt bundle or a changed backend must show up on the
    # next load.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /config.json {
        add_header Cache-Control "no-store";
        # Absent (no backend passed to the container): a real 404, not the
        # SPA fallback, so the app goes to its setup screen.
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip             on;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length  1024;
}
