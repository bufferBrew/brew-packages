name: brew_core
description: >-
  Shared cross-app data layer for the Brew ecosystem: encrypted LLM provider
  settings backed by core.llm_configs and third-party connectors backed by
  core.connections. Models, repositories and controllers only — no widgets.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Kept at the lowest version any consuming app pins, so adding brew_core never
  # forces an app to upgrade. Apps on newer versions resolve upward as usual.
  flutter_riverpod: ^3.3.2
  http: ^1.2.0
  shared_preferences: ^2.2.0
  supabase_flutter: ^2.15.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
