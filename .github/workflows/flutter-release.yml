name: Flutter release (reusable)

# Builds a Brew app for every platform it supports and, for a release,
# publishes a GitHub Release plus a web Docker image. Called from each app:
#
#   jobs:
#     release:
#       uses: bufferBrew/brew-packages/.github/workflows/flutter-release.yml@<tag>
#       with:
#         app: brewwire
#         platforms: android,web,windows
#         publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
#       secrets: inherit
#
# Backend:
#   - The web bundle and image are built WITHOUT dart-defines: the container
#     writes config.json from SUPABASE_URL/SUPABASE_ANON_KEY at start, so one
#     image serves any backend.
#   - Native builds (Android, desktop) bake in the app's default backend when
#     the repo defines the RELEASE_SUPABASE_URL and RELEASE_SUPABASE_ANON_KEY
#     secrets (the anon key is public by design). Without them a native build
#     starts with no backend.

on:
  workflow_call:
    inputs:
      app:
        description: Short app name, used for artifact and image names (e.g. brewwire)
        required: true
        type: string
      platforms:
        description: Comma-separated subset of android,web,linux,windows,macos
        required: true
        type: string
      publish:
        description: Create a GitHub Release and push the web image (true on a tag)
        required: false
        type: boolean
        default: false
      flutter-version:
        required: false
        type: string
        default: 3.44.8
    secrets:
      RELEASE_SUPABASE_URL:
        required: false
      RELEASE_SUPABASE_ANON_KEY:
        required: false

permissions:
  contents: write
  packages: write

env:
  APP: ${{ inputs.app }}
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('pr-{0}', github.sha) }}

jobs:
  web:
    if: contains(inputs.platforms, 'web')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ inputs.flutter-version }}', channel: stable, cache: true }
      - run: flutter pub get
      - name: Build web (no dart-defines; the image supplies config.json)
        run: flutter build web --release
      - name: Package
        run: (cd build/web && zip -qr "$GITHUB_WORKSPACE/$APP-web-$VERSION.zip" .)
      - uses: actions/upload-artifact@v4
        with: { name: '${{ inputs.app }}-web', path: '*.zip', if-no-files-found: error }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Web image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: |
            ghcr.io/bufferbrew/${{ inputs.app }}-web:${{ env.VERSION }}
            ghcr.io/bufferbrew/${{ inputs.app }}-web:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  android:
    if: contains(inputs.platforms, 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ inputs.flutter-version }}', channel: stable, cache: true }
      - name: Default backend
        id: backend
        env:
          URL: ${{ secrets.RELEASE_SUPABASE_URL }}
          KEY: ${{ secrets.RELEASE_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}\n' "$URL" "$KEY" > "$RUNNER_TEMP/release.json"
            echo "args=--dart-define-from-file=$RUNNER_TEMP/release.json" >> "$GITHUB_OUTPUT"
          fi
      - run: flutter pub get
      - run: flutter build apk --release ${{ steps.backend.outputs.args }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk "$APP-android-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with: { name: '${{ inputs.app }}-android', path: '*.apk', if-no-files-found: error }

  linux:
    if: contains(inputs.platforms, 'linux')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Desktop toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ inputs.flutter-version }}', channel: stable, cache: true }
      - name: Default backend
        id: backend
        env:
          URL: ${{ secrets.RELEASE_SUPABASE_URL }}
          KEY: ${{ secrets.RELEASE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}\n' "$URL" "$KEY" > "$RUNNER_TEMP/release.json"
            echo "args=--dart-define-from-file=$RUNNER_TEMP/release.json" >> "$GITHUB_OUTPUT"
          fi
      - run: flutter pub get
      - run: flutter build linux --release ${{ steps.backend.outputs.args }}
      - run: tar -czf "$APP-linux-x64-$VERSION.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with: { name: '${{ inputs.app }}-linux', path: '*.tar.gz', if-no-files-found: error }

  windows:
    if: contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ inputs.flutter-version }}', channel: stable, cache: true }
      - name: Default backend
        id: backend
        shell: bash
        env:
          URL: ${{ secrets.RELEASE_SUPABASE_URL }}
          KEY: ${{ secrets.RELEASE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}\n' "$URL" "$KEY" > "$RUNNER_TEMP/release.json"
            echo "args=--dart-define-from-file=$RUNNER_TEMP/release.json" >> "$GITHUB_OUTPUT"
          fi
      - run: flutter pub get
      - run: flutter build windows --release ${{ steps.backend.outputs.args }}
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "$env:APP-windows-x64-$env:VERSION.zip"
      - uses: actions/upload-artifact@v4
        with: { name: '${{ inputs.app }}-windows', path: '*.zip', if-no-files-found: error }

  macos:
    if: contains(inputs.platforms, 'macos')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ inputs.flutter-version }}', channel: stable, cache: true }
      - name: Default backend
        id: backend
        env:
          URL: ${{ secrets.RELEASE_SUPABASE_URL }}
          KEY: ${{ secrets.RELEASE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}\n' "$URL" "$KEY" > "$RUNNER_TEMP/release.json"
            echo "args=--dart-define-from-file=$RUNNER_TEMP/release.json" >> "$GITHUB_OUTPUT"
          fi
      - run: flutter pub get
      - run: flutter build macos --release ${{ steps.backend.outputs.args }}
      - name: Package (unsigned)
        run: |
          app=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          ditto -c -k --keepParent "$app" "$APP-macos-$VERSION.zip"
      - uses: actions/upload-artifact@v4
        with: { name: '${{ inputs.app }}-macos', path: '*.zip', if-no-files-found: error }

  release:
    if: inputs.publish && !cancelled() && !contains(needs.*.result, 'failure')
    needs: [web, android, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          notes="Downloads for ${APP} ${VERSION}.

          - Android: install the .apk.
          - Windows / Linux / macOS: unzip and run. The macOS app is unsigned: right-click, Open, the first time.
          - Web / Docker: ghcr.io/bufferbrew/${APP}-web:${VERSION} (see the repo's compose.yml)."
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --title "$APP $VERSION" --notes "$notes" \
            || gh release upload "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
