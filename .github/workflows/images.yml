name: Images

# brew-migrate for every release tag, for amd64 and arm64, so an app's
# compose.yml can pin ghcr.io/bufferbrew/brew-migrate:<tag>.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: [supabase/**, .github/workflows/images.yml]

permissions:
  contents: read
  packages: write

jobs:
  brew-migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: supabase
          file: supabase/migrate/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/bufferbrew/brew-migrate:${{ github.ref_name }}
            ghcr.io/bufferbrew/brew-migrate:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Installs Brew database bundles into a Supabase Postgres
